/* ─── Helpers ────────────────────────────────────────────────── */
function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; }
    catch { return init; }
  });
  useEffect(() => { localStorage.setItem(key, JSON.stringify(val)); }, [key, val]);
  return [val, setVal];
}

function pct(v, max) { return Math.min(100, Math.round((v / max) * 100)); }

function ProgressBar({ value, max, color = "blue" }) {
  const p = pct(value, max);
  const colors = { blue: "from-blue-500 to-indigo-500", green: "from-emerald-400 to-teal-500", orange: "from-orange-400 to-amber-500", sky: "from-sky-400 to-cyan-400" };
  return (
    <div className="progress-bar w-full mt-2">
      <div className={`progress-fill bg-gradient-to-r ${colors[color]}`} style={{ width: `${p}%` }} />
    </div>
  );
}

/* ─── Food Database Modal ────────────────────────────────────── */

  { key: "protein",    label: "Protein" },
  { key: "carb",       label: "Carb" },
  { key: "dairy",      label: "Sữa" },

];

  carb:       "text-yellow-300 bg-yellow-400/15 border-yellow-400/20",
  dairy:      "text-sky-300 bg-sky-400/15 border-sky-400/20",

  other:      "text-white/50 bg-white/5 border-white/10",
};

const emptyDBForm = { name: "", calories: "", protein: "", portion: "", category: "protein" };

  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("all");
  const [editItem, setEditItem] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyDBForm);
  const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const filtered = foodDB.filter(f =>
    f.name.toLowerCase().includes(search.toLowerCase()) &&
    (catFilter === "all" || f.category === catFilter)
  );

  function openAdd() { setEditItem(null); setForm(emptyDBForm); setShowForm(true); }
  function openEdit(item) { setEditItem(item); setForm({ name: item.name, calories: item.calories, protein: item.protein, portion: item.portion, category: item.category }); setShowForm(true); }

  function saveForm() {
    if (!form.name || !form.calories || !form.protein) return;
    const entry = { ...form, calories: +form.calories, protein: +form.protein };
    if (editItem) {
      setFoodDB(db => db.map(f => f.id === editItem.id ? { ...entry, id: editItem.id } : f));
    } else {
      setFoodDB(db => [...db, { ...entry, id: Date.now() }]);
    }
    setShowForm(false); setEditItem(null);
  }

  function deleteItem(id) { if (confirm("Xoá thực phẩm này khỏi database?")) setFoodDB(db => db.filter(f => f.id !== id)); }

  const catLabel = k => DB_CATEGORIES.find(c => c.key === k)?.label || "Khác";

  return (
    <div className="fixed inset-0 modal-bg z-50 flex items-end sm:items-center justify-center" onClick={e => e.target === e.currentTarget && onClose()}>

            <Icon name="database" cls="w-5 h-5 text-violet-400" />
            <h3 className="text-base font-bold">Database thực phẩm</h3>
            <span className="text-xs bg-violet-400/15 text-violet-300 border border-violet-400/20 px-2 py-0.5 rounded-full">{foodDB.length} món</span>
          </div>
          <button onClick={onClose} className="text-white/50 hover:text-white p-1"><Icon name="x" /></button>
        </div>

        {/* Search + Filter */}
        <div className="px-4 pt-3 pb-2 border-b border-white/10 shrink-0 space-y-2">
          <div className="relative">
            <Icon name="search" cls="w-4 h-4 text-white/40 absolute left-3 top-1/2 -translate-y-1/2" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm tên thực phẩm..." className="w-full bg-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 border border-white/10" />
          </div>
          <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
            {DB_CATEGORIES.map(c => (
              <button key={c.key} onClick={() => setCatFilter(c.key)} className={`shrink-0 text-xs px-3 py-1.5 rounded-full font-medium transition-colors ${catFilter === c.key ? "bg-violet-500 text-white" : "bg-white/10 text-white/60 hover:bg-white/15"}`}>{c.label}</button>
            ))}
          </div>
        </div>

        {/* Food List */}
        <div className="flex-1 overflow-y-auto px-4 py-3 space-y-1.5">
          {filtered.length === 0 ? (
            <div className="text-center py-10 text-white/30 text-sm">
              <Icon name="search" cls="w-10 h-10 mx-auto mb-2 opacity-20" />
              Không tìm thấy thực phẩm nào
            </div>
          ) : filtered.map(food => (
            <div key={food.id} className="flex items-center gap-2 bg-white/5 hover:bg-white/8 rounded-xl px-3 py-2.5 transition-colors group">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-sm font-medium">{food.name}</span>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full border ${CAT_COLORS[food.category] || CAT_COLORS.other}`}>{catLabel(food.category)}</span>
                </div>
                <div className="flex gap-3 mt-0.5">
                  <span className="text-xs text-orange-400">{food.calories} kcal</span>
                  <span className="text-xs text-emerald-400">{food.protein}g protein</span>
                  {food.portion && <span className="text-xs text-white/35">{food.portion}</span>}
                </div>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={() => onSelect(food)} title="Thêm vào bữa ăn" className="p-1.5 rounded-lg bg-violet-500/20 hover:bg-violet-500/35 text-violet-300 transition-colors">

                </button>
                <button onClick={() => openEdit(food)} className="p-1.5 rounded-lg text-white/35 hover:text-blue-400 hover:bg-blue-400/10 transition-colors hidden sm:block">
                  <Icon name="edit" cls="w-3.5 h-3.5" />
                </button>
                <button onClick={() => deleteItem(food.id)} className="p-1.5 rounded-lg text-white/35 hover:text-red-400 hover:bg-red-400/10 transition-colors hidden sm:block">
                  <Icon name="trash" cls="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          ))}
        </div>

        {/* Add/Edit Form */}
        {showForm ? (
          <div className="border-t border-white/10 px-4 py-4 bg-violet-500/5 shrink-0 space-y-2">

              <input type="number" value={form.protein} onChange={e => setF("protein", e.target.value)} placeholder="Protein (g) *" className="bg-white/10 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500 border border-white/10" />
              <input value={form.portion} onChange={e => setF("portion", e.target.value)} placeholder="Khẩu phần" className="bg-white/10 rounded-lg px-3 py-2 text-sm outline-none border border-white/10" />
            </div>
            <select value={form.category} onChange={e => setF("category", e.target.value)} className="w-full bg-white/10 rounded-lg px-3 py-2 text-sm outline-none border border-white/10">

            </select>
            <div className="flex gap-2 pt-1">
              <button onClick={() => { setShowForm(false); setEditItem(null); }} className="flex-1 py-2 rounded-lg bg-white/10 text-sm">Huỷ</button>
              <button onClick={saveForm} disabled={!form.name || !form.calories || !form.protein} className="flex-1 py-2 rounded-lg bg-violet-600 hover:bg-violet-700 text-sm font-medium disabled:opacity-40 transition-colors">
                {editItem ? "Cập nhật" : "Lưu vào database"}
              </button>
            </div>
          </div>
        ) : (
          <div className="px-4 py-3 border-t border-white/10 shrink-0">
            <button onClick={openAdd} className="w-full py-2.5 rounded-xl border border-dashed border-violet-400/40 text-violet-400 hover:bg-violet-400/10 flex items-center justify-center gap-2 text-sm font-medium transition-colors">

/* ─── Food Form Modal ────────────────────────────────────────── */
function FoodModal({ meal, item, prefill, foodDB, onSave, onClose, onOpenDB }) {
  const [form, setForm] = useState(
    item ? item : prefill ? { name: prefill.name, calories: prefill.calories, protein: prefill.protein, portion: prefill.portion || "", note: "" } : { name: "", calories: "", protein: "", portion: "", note: "" }
  );
  const [mealType, setMealType] = useState(meal);
  const [dbQuery, setDbQuery] = useState("");
  const [showSuggest, setShowSuggest] = useState(false);
  const suggestRef = useRef(null);
  const mealLabels = { breakfast: "Bữa sáng", lunch: "Bữa trưa", dinner: "Bữa tối", snack: "Bữa phụ" };
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const valid = form.name && form.calories && form.protein;

  const suggestions = dbQuery.trim().length > 0
    ? foodDB.filter(f => f.name.toLowerCase().includes(dbQuery.toLowerCase())).slice(0, 6)
    : [];

  function pickFromDB(food) {
    setForm({ name: food.name, calories: food.calories, protein: food.protein, portion: food.portion || "", note: "" });
    setDbQuery(""); setShowSuggest(false);
  }

  useEffect(() => {
    function handler(e) { if (suggestRef.current && !suggestRef.current.contains(e.target)) setShowSuggest(false); }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  return (
    <div className="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="glass-card w-full max-w-md p-6 fade-in">
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-lg font-bold">{item ? "Chỉnh sửa thực phẩm" : "Thêm thực phẩm"}</h3>
          <button onClick={onClose} className="text-white/50 hover:text-white"><Icon name="x" /></button>
        </div>

        {/* DB Quick Search */}
        {!item && (
          <div className="mb-4" ref={suggestRef}>
            <label className="text-xs text-white/60 mb-1 block">Tìm nhanh từ database</label>
            <div className="relative">
              <Icon name="search" cls="w-4 h-4 text-white/40 absolute left-3 top-1/2 -translate-y-1/2" />
              <input
                value={dbQuery}
                onChange={e => { setDbQuery(e.target.value); setShowSuggest(true); }}
                onFocus={() => dbQuery && setShowSuggest(true)}
                placeholder="Gõ tên món để tìm..."
                className="w-full bg-white/10 rounded-lg pl-9 pr-9 py-2.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 border border-white/10"
              />
              <button onClick={onOpenDB} title="Mở database đầy đủ" className="absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded text-violet-400 hover:text-violet-300">
                <Icon name="database" cls="w-4 h-4" />
              </button>
            </div>
            {showSuggest && suggestions.length > 0 && (
              <div className="absolute z-10 mt-1 w-full max-w-sm bg-gray-900 border border-white/15 rounded-xl shadow-xl overflow-hidden">
                {suggestions.map(f => (
                  <button key={f.id} onMouseDown={() => pickFromDB(f)} className="w-full flex items-center justify-between px-3 py-2.5 hover:bg-white/10 text-left transition-colors">
                    <div>
                      <span className="text-sm font-medium block">{f.name}</span>
                      <span className="text-xs text-white/40">{f.portion}</span>
                    </div>
                    <div className="text-right shrink-0 ml-3">
                      <span className="text-xs text-orange-400 block">{f.calories} kcal</span>
                      <span className="text-xs text-emerald-400">{f.protein}g protein</span>
                    </div>
                  </button>
                ))}
              </div>
            )}
            {showSuggest && dbQuery.trim() && suggestions.length === 0 && (
              <div className="mt-1 px-3 py-2.5 bg-gray-900 border border-white/10 rounded-xl text-xs text-white/40">
                Không tìm thấy — nhập thủ công bên dưới hoặc <button className="text-violet-400 underline" onMouseDown={onOpenDB}>mở database</button>
              </div>
            )}
            <div className="flex items-center gap-2 mt-2">
              <div className="flex-1 h-px bg-white/10" />
              <span className="text-xs text-white/30">hoặc nhập thủ công</span>
              <div className="flex-1 h-px bg-white/10" />
            </div>
          </div>
        )}

        <div className="space-y-3">
          <div>
            <label className="text-xs text-white/60 mb-1 block">Tên thực phẩm</label>
            <input value={form.name} onChange={e => set("name", e.target.value)} placeholder="VD: Chicken breast" className="w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 border border-white/10" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-white/60 mb-1 block">Calories (kcal)</label>
              <input type="number" value={form.calories} onChange={e => set("calories", e.target.value)} placeholder="330" className="w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-500 border border-white/10" />
            </div>
            <div>
              <label className="text-xs text-white/60 mb-1 block">Protein (g)</label>
              <input type="number" value={form.protein} onChange={e => set("protein", e.target.value)} placeholder="62" className="w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 border border-white/10" />
            </div>
          </div>
          <div>
            <label className="text-xs text-white/60 mb-1 block">Khẩu phần</label>
            <input value={form.portion} onChange={e => set("portion", e.target.value)} placeholder="VD: 250g, 1 bowl" className="w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 border border-white/10" />
          </div>
          <div>
            <label className="text-xs text-white/60 mb-1 block">Bữa ăn</label>
            <select value={mealType} onChange={e => setMealType(e.target.value)} className="w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 border border-white/10">
              {Object.entries(mealLabels).map(([k, v]) => <option key={k} value={k} className="bg-gray-900">{v}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-white/60 mb-1 block">Ghi chú (tuỳ chọn)</label>
            <input value={form.note} onChange={e => set("note", e.target.value)} placeholder="Ghi chú..." className="w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 border border-white/10" />
          </div>
        </div>
        <div className="flex gap-2 mt-5">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg bg-white/10 hover:bg-white/15 text-sm font-medium transition-colors">Huỷ</button>
          <button disabled={!valid} onClick={() => onSave({ ...form, calories: +form.calories, protein: +form.protein }, mealType)} className="flex-1 py-2.5 rounded-lg bg-gradient-to-r from-blue-500 to-indigo-600 text-sm font-medium disabled:opacity-40 hover:opacity-90 transition-opacity">Lưu</button>
        </div>
      </div>
    </div>
  );
}

/* ─── Nutrition Tab ──────────────────────────────────────────── */
function NutritionTab({ meals, setMeals, goals, foodDB, setFoodDB }) {
  const [modal, setModal] = useState(null); // { meal, item? }
  const [showDB, setShowDB] = useState(false);
  const [waterMl, setWaterMl] = useLocalStorage("ft_water", 750);
  const [cupSize, setCupSize] = useState(250);

  const allFoods = Object.values(meals).flat();
  const totalCal = allFoods.reduce((s, f) => s + f.calories, 0);
  const totalProt = allFoods.reduce((s, f) => s + f.protein, 0);

  const mealMeta = {
    breakfast: { label: "Bữa sáng", icon: "sun", color: "from-amber-500/20 to-orange-500/20", border: "border-amber-500/30", badge: "bg-amber-500/20 text-amber-300" },
    lunch:     { label: "Bữa trưa", icon: "sun",   color: "from-green-500/20 to-emerald-500/20", border: "border-green-500/30", badge: "bg-green-500/20 text-green-300" },
    dinner:    { label: "Bữa tối",  icon: "moon",  color: "from-indigo-500/20 to-purple-500/20", border: "border-indigo-500/30", badge: "bg-indigo-500/20 text-indigo-300" },
    snack:     { label: "Bữa phụ", icon: "coffee", color: "from-pink-500/20 to-rose-500/20", border: "border-pink-500/30", badge: "bg-pink-500/20 text-pink-300" },
  };

  function handleSave(food, mealType) {
    const id = modal.item ? modal.item.id : Date.now();
    const newItem = { ...food, id };
    if (modal.item && modal.meal !== mealType) {
      setMeals(m => {
        const next = { ...m };
        next[modal.meal] = next[modal.meal].filter(f => f.id !== modal.item.id);
        next[mealType] = [...next[mealType], newItem];
        return next;
      });
    } else if (modal.item) {
      setMeals(m => ({ ...m, [mealType]: m[mealType].map(f => f.id === id ? newItem : f) }));
    } else {
      setMeals(m => ({ ...m, [mealType]: [...m[mealType], newItem] }));
    }
    setModal(null);
  }

  function handleDelete(mealType, id) {
    setMeals(m => ({ ...m, [mealType]: m[mealType].filter(f => f.id !== id) }));
  }

  const calLeft = goals.calories - totalCal;
  const protLeft = goals.protein - totalProt;
  const waterL = (waterMl / 1000).toFixed(2);
  const waterGoalL = (goals.water / 1000).toFixed(1);

  return (
    <div className="space-y-4 pb-6">
      {/* DB shortcut banner */}
      <button onClick={() => setShowDB(true)} className="w-full glass-card px-4 py-3 flex items-center justify-between hover:bg-violet-500/10 transition-colors border-violet-400/20">
        <div className="flex items-center gap-2">
          <Icon name="database" cls="w-4 h-4 text-violet-400" />
          <span className="text-sm font-medium text-violet-300">Database thực phẩm</span>
          <span className="text-xs bg-violet-400/15 text-violet-300 px-2 py-0.5 rounded-full">{foodDB.length} món</span>
        </div>
        <span className="text-xs text-white/40">Xem &amp; quản lý →</span>
      </button>

      {/* Daily Summary */}
      <div className="glass-card p-5">
        <h2 className="font-bold text-base mb-4 flex items-center gap-2"><Icon name="fire" cls="w-5 h-5 text-orange-400" /> Tổng kết hôm nay</h2>
        <div className="grid grid-cols-2 gap-4 mb-4">
          <div>
            <div className="flex justify-between text-sm mb-1">
              <span className="text-white/60">Calories</span>
              <span className="font-semibold">{totalCal.toLocaleString()} <span className="text-white/40">/ {goals.calories.toLocaleString()}</span></span>
            </div>
            <ProgressBar value={totalCal} max={goals.calories} color="orange" />
            <p className={`text-xs mt-1 ${calLeft < 0 ? "text-red-400" : "text-white/40"}`}>{calLeft < 0 ? `Vượt ${Math.abs(calLeft)} kcal` : `Còn lại ${calLeft} kcal`}</p>
          </div>
          <div>
            <div className="flex justify-between text-sm mb-1">
              <span className="text-white/60">Protein</span>
              <span className="font-semibold">{totalProt}g <span className="text-white/40">/ {goals.protein}g</span></span>
            </div>
            <ProgressBar value={totalProt} max={goals.protein} color="green" />
            <p className={`text-xs mt-1 ${protLeft < 0 ? "text-red-400" : "text-white/40"}`}>{protLeft < 0 ? `Vượt ${Math.abs(protLeft)}g` : `Còn lại ${protLeft}g`}</p>
          </div>
        </div>
      </div>

      {/* Water Tracker */}
      <div className="glass-card p-5">
        <div className="flex justify-between items-center mb-3">
          <h2 className="font-bold text-base flex items-center gap-2"><Icon name="water" cls="w-5 h-5 text-sky-400" /> Nước uống</h2>
          <div className="flex items-center gap-2">
            <select value={cupSize} onChange={e => setCupSize(+e.target.value)} className="bg-white/10 rounded-lg px-2 py-1 text-xs border border-white/10 outline-none">
              <option value={200} className="bg-gray-900">200ml</option>
              <option value={250} className="bg-gray-900">250ml</option>
              <option value={500} className="bg-gray-900">500ml</option>
            </select>
            <button onClick={() => setWaterMl(w => w + cupSize)} className="bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/30 rounded-lg px-3 py-1 text-xs font-medium text-sky-300 transition-colors">+ 1 ly</button>
            {waterMl > 0 && <button onClick={() => setWaterMl(w => Math.max(0, w - cupSize))} className="bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg px-2 py-1 text-xs text-white/50 transition-colors">−</button>}
          </div>
        </div>
        <div className="flex justify-between text-sm mb-1">
          <span className="text-white/60">{waterL}L</span>
          <span className="text-white/40">/ {waterGoalL}L</span>
        </div>
        <ProgressBar value={waterMl} max={goals.water} color="sky" />
        <div className="flex gap-1.5 mt-3 flex-wrap">
          {Array.from({ length: Math.ceil(goals.water / cupSize) }, (_, i) => (
            <div key={i} className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs transition-all ${i < Math.floor(waterMl / cupSize) ? "bg-sky-500/40 border border-sky-400/50 text-sky-300" : "bg-white/5 border border-white/10 text-white/20"}`}>
              <Icon name="water" cls="w-3.5 h-3.5" />
            </div>
          ))}
        </div>
      </div>

      {/* Meal Cards */}
      {Object.entries(mealMeta).map(([mealKey, meta]) => {
        const foods = meals[mealKey] || [];
        const mealCal = foods.reduce((s, f) => s + f.calories, 0);
        const mealProt = foods.reduce((s, f) => s + f.protein, 0);
        return (
          <div key={mealKey} className={`glass-card p-5 bg-gradient-to-br ${meta.color} border ${meta.border}`}>
            <div className="flex justify-between items-center mb-3">
              <div className="flex items-center gap-2">
                <span className={`text-xs font-medium px-2.5 py-1 rounded-full ${meta.badge}`}>{meta.label}</span>
                <span className="text-xs text-white/40">{mealCal} kcal · {mealProt}g protein</span>
              </div>
              <button onClick={() => setModal({ meal: mealKey })} className="flex items-center gap-1 text-xs bg-white/10 hover:bg-white/15 px-2.5 py-1.5 rounded-lg transition-colors">
                <Icon name="plus" cls="w-3.5 h-3.5" /> Thêm
              </button>
            </div>
            {foods.length === 0 ? (
              <p className="text-sm text-white/30 text-center py-3">Chưa có thực phẩm</p>
            ) : (
              <div className="space-y-2">
                {foods.map(food => (
                  <div key={food.id} className="flex items-center justify-between bg-white/5 rounded-xl px-3 py-2.5 gap-2">
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-medium truncate">{food.name}</span>
                        {food.portion && <span className="text-xs text-white/40 shrink-0">{food.portion}</span>}
                      </div>
                      <div className="flex gap-3 mt-0.5">
                        <span className="text-xs text-orange-400">{food.calories} kcal</span>
                        <span className="text-xs text-emerald-400">{food.protein}g protein</span>
                        {food.note && <span className="text-xs text-white/30 truncate">{food.note}</span>}
                      </div>
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={() => setModal({ meal: mealKey, item: food })} className="p-1.5 rounded-lg text-white/40 hover:text-blue-400 hover:bg-blue-400/10 transition-colors"><Icon name="edit" cls="w-3.5 h-3.5" /></button>
                      <button onClick={() => handleDelete(mealKey, food.id)} className="p-1.5 rounded-lg text-white/40 hover:text-red-400 hover:bg-red-400/10 transition-colors"><Icon name="trash" cls="w-3.5 h-3.5" /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

      {modal && (
        <FoodModal
          meal={modal.meal}
          item={modal.item}
          prefill={modal.prefill}
          foodDB={foodDB}
          onSave={handleSave}
          onClose={() => setModal(null)}
          onOpenDB={() => { setModal(null); setShowDB(true); }}
        />
      )}
      {showDB && (
        <FoodDBModal
          foodDB={foodDB}
          setFoodDB={setFoodDB}
          onSelect={food => {
            setShowDB(false);
            // Pre-fill modal with DB food; default to breakfast if no meal context
            setModal({ meal: "breakfast", item: null, prefill: food });
          }}
          onClose={() => setShowDB(false)}
        />
      )}
    </div>
  );
}

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

const emptyActivityForm = { steps: "", distance: "", caloriesBurned: "" };
const STEPS_PER_KM = 1300;
const KCAL_PER_KM = 60;

function round1(n) { return Math.round(n * 10) / 10; }

function activityFromSteps(steps) {
  const distance = round1(steps / STEPS_PER_KM);
  return {
    steps: Math.round(steps),
    distance,
    caloriesBurned: Math.round(distance * KCAL_PER_KM),
  };
}

function activityFromDistance(distance) {
  return {
    steps: Math.round(distance * STEPS_PER_KM),
    distance: round1(distance),
    caloriesBurned: Math.round(distance * KCAL_PER_KM),
  };
}

function resolveActivity(form) {
  const stepsStr = form.steps.trim();
  const distStr = form.distance.trim();
  if (!stepsStr && !distStr) return null;
  if (stepsStr) {
    const steps = Number(stepsStr);
    if (isNaN(steps) || steps < 0) return null;
    return activityFromSteps(steps);
  }
  const distance = Number(distStr);
  if (isNaN(distance) || distance < 0) return null;
  return activityFromDistance(distance);
}

function activityToForm({ steps, distance, caloriesBurned }) {
  return {
    steps: String(steps),
    distance: String(distance),
    caloriesBurned: String(caloriesBurned),
  };
}

/* ─── Daily Activity Box ─────────────────────────────────────── */
function DailyActivityBox() {
  const [savedByDate, setSavedByDate] = useLocalStorage("ft_daily_activity", {});
  const today = todayKey();
  const saved = savedByDate[today] || null;

  const [form, setForm] = useState(emptyActivityForm);
  const [editing, setEditing] = useState(!saved);
  const [error, setError] = useState("");

  useEffect(() => {
    if (saved) {
      setForm(activityToForm(saved));
      setEditing(false);
    } else {
      setForm(emptyActivityForm);
      setEditing(true);
    }
    setError("");
  }, [today, saved?.steps, saved?.distance, saved?.caloriesBurned]);

  function handleStepsChange(v) {
    if (error) setError("");
    const trimmed = v.trim();
    if (!trimmed) {
      const distStr = form.distance.trim();
      if (distStr && !isNaN(+distStr) && +distStr >= 0) {
        setForm(activityToForm(activityFromDistance(+distStr)));
      } else {
        setForm(emptyActivityForm);
      }
      return;
    }
    const steps = Number(trimmed);
    if (isNaN(steps) || steps < 0) {
      setForm(f => ({ ...f, steps: v }));
      return;
    }
    setForm(activityToForm(activityFromSteps(steps)));
  }

  function handleDistanceChange(v) {
    if (error) setError("");
    const trimmed = v.trim();
    if (!trimmed) {
      const stepsStr = form.steps.trim();
      if (stepsStr && !isNaN(+stepsStr) && +stepsStr >= 0) {
        setForm(activityToForm(activityFromSteps(+stepsStr)));
      } else {
        setForm(emptyActivityForm);
      }
      return;
    }
    const distance = Number(trimmed);
    if (isNaN(distance) || distance < 0) {
      setForm(f => ({ ...f, distance: v }));
      return;
    }
    setForm(activityToForm(activityFromDistance(distance)));
  }

  function handleSave() {
    const entry = resolveActivity(form);
    if (!entry) {
      setError("Please enter steps or distance.");
      return;
    }
    setForm(activityToForm(entry));
    setSavedByDate(d => ({ ...d, [today]: entry }));
    setEditing(false);
    setError("");
  }

  function handleEdit() {
    setEditing(true);
    setError("");
  }

  function handleReset() {
    if (!confirm("Reset today's activity data?")) return;
    setSavedByDate(d => {
      const next = { ...d };
      delete next[today];
      return next;
    });
    setForm(emptyActivityForm);
    setEditing(true);
    setError("");
  }

  const inputCls = "w-full bg-white/10 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500 border border-white/10";

  return (
    <div className="glass-card p-5 bg-gradient-to-br from-teal-500/15 to-cyan-500/10 border border-teal-500/25">
      <div className="flex justify-between items-center mb-4">
        <h2 className="font-bold text-base flex items-center gap-2">
          <Icon name="steps" cls="w-5 h-5 text-teal-400" />
          Daily Activity
        </h2>
        {saved && !editing && (
          <span className="text-xs bg-teal-500/20 text-teal-300 border border-teal-500/30 px-2 py-0.5 rounded-full">Saved</span>
        )}
      </div>

      {saved && !editing ? (
        <div className="space-y-3">
          <div className="grid grid-cols-3 gap-3">
            {[
              { label: "Steps / Bước chân", value: saved.steps.toLocaleString(), unit: "steps", color: "text-blue-400" },
              { label: "Distance / Số km", value: saved.distance, unit: "km", color: "text-teal-400" },
              { label: "Calories Burned", value: saved.caloriesBurned, unit: "kcal", color: "text-orange-400" },
            ].map(s => (
              <div key={s.label} className="bg-white/5 rounded-xl p-3 text-center">
                <div className={`text-lg font-bold ${s.color}`}>{s.value}</div>
                <div className="text-xs text-white/40">{s.unit}</div>
                <div className="text-xs text-white/50 mt-1 leading-tight">{s.label}</div>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <button onClick={handleEdit} className="flex-1 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-medium flex items-center justify-center gap-1.5 transition-colors">
              <Icon name="edit" cls="w-4 h-4" /> Edit
            </button>
            <button onClick={handleReset} className="py-2.5 px-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm font-medium transition-colors">
              Reset
            </button>
          </div>
        </div>
      ) : (
        <div className="space-y-3">
          <p className="text-xs text-white/45 leading-relaxed">
            Nhập <span className="text-white/70">Steps</span> hoặc <span className="text-white/70">Distance</span> — app tự tính các giá trị còn lại
            <span className="text-white/30"> (1 km ≈ 1,300 steps · 1 km ≈ 60 kcal)</span>
          </p>
          <div>
            <label className="text-xs text-white/60 mb-1 block">Steps / Bước chân</label>
            <input type="number" min="0" value={form.steps} onChange={e => handleStepsChange(e.target.value)} placeholder="8500" className={inputCls} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs text-white/60 mb-1 block">Distance / Số km</label>
              <input type="number" min="0" step="0.1" value={form.distance} onChange={e => handleDistanceChange(e.target.value)} placeholder="6.2" className={inputCls} />
            </div>
            <div>
              <label className="text-xs text-white/60 mb-1 block">Calories Burned (kcal)</label>
              <input type="number" min="0" value={form.caloriesBurned} readOnly placeholder="420" className={`${inputCls} opacity-70 cursor-not-allowed`} title="Tự động tính từ distance" />
            </div>
          </div>
          {error && (
            <p className="text-sm text-amber-300/90 bg-amber-500/10 border border-amber-500/20 rounded-lg px-3 py-2">
              {error}
            </p>
          )}
          <div className="flex gap-2">
            {saved && (
              <button onClick={() => { setEditing(false); setForm(activityToForm(saved)); setError(""); }} className="py-2.5 px-4 rounded-xl bg-white/10 hover:bg-white/15 text-sm transition-colors">
                Cancel
              </button>
            )}
            <button onClick={handleSave} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-600 hover:opacity-90 text-sm font-medium flex items-center justify-center gap-1.5 transition-opacity">
              <Icon name="save" cls="w-4 h-4" /> Save activity
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Workout Tab ────────────────────────────────────────────── */
function WorkoutTab({ workouts, setWorkouts }) {
  const [modal, setModal] = useState(null);
  const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const dayColors = ["from-red-500/20","from-orange-500/20","from-yellow-500/20","from-green-500/20","from-blue-500/20","from-purple-500/20","from-pink-500/20"];

  function handleSave(data) {
    if (modal.item) {
      setWorkouts(w => w.map(x => x.id === modal.item.id ? { ...data, id: modal.item.id } : x));
    } else {
      setWorkouts(w => [...w, { ...data, id: Date.now() }]);
    }
    setModal(null);
  }

  function toggleDone(id) { setWorkouts(w => w.map(x => x.id === id ? { ...x, done: !x.done } : x)); }
  function deleteW(id) { setWorkouts(w => w.filter(x => x.id !== id)); }

  const doneCount = workouts.filter(w => w.done).length;
  const totalMinutes = workouts.filter(w => w.done).reduce((s, w) => s + w.duration, 0);
  const totalBurned = workouts.filter(w => w.done).reduce((s, w) => s + (w.calories || 0), 0);

  return (
    <div className="space-y-4 pb-6">
      {/* Week Summary */}
      <div className="glass-card p-5">
        <h2 className="font-bold text-base mb-4 flex items-center gap-2"><Icon name="dumbbell" cls="w-5 h-5 text-blue-400" /> Tuần này</h2>
        <div className="grid grid-cols-3 gap-3">
          {[
            { label: "Buổi tập", value: doneCount, unit: "buổi", color: "text-blue-400" },
            { label: "Thời gian", value: totalMinutes, unit: "phút", color: "text-purple-400" },
            { label: "Calo đốt", value: totalBurned, unit: "kcal", color: "text-orange-400" },
          ].map(s => (
            <div key={s.label} className="bg-white/5 rounded-xl p-3 text-center">
              <div className={`text-2xl font-bold ${s.color}`}>{s.value}</div>
              <div className="text-xs text-white/40">{s.unit}</div>
              <div className="text-xs text-white/60 mt-0.5">{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      <DailyActivityBox />

      {/* Add Button */}
      <button onClick={() => setModal({})} className="w-full glass-card p-4 flex items-center justify-center gap-2 text-blue-400 hover:bg-blue-400/10 border-dashed border-blue-400/30 transition-colors text-sm font-medium">
        <Icon name="plus" /> Thêm buổi tập mới
      </button>

      {/* Day columns */}
      {days.map((day, di) => {
        const dayWorkouts = workouts.filter(w => w.date === day);
        if (dayWorkouts.length === 0) return null;
        return (
          <div key={day} className={`glass-card p-5 bg-gradient-to-br ${dayColors[di]} to-transparent`}>
            <h3 className="font-semibold text-sm mb-3 text-white/80">{day}</h3>
            <div className="space-y-3">
              {dayWorkouts.map(w => (
                <div key={w.id} className={`flex items-start gap-3 bg-white/5 rounded-xl p-3.5 transition-all ${w.done ? "workout-done" : ""}`}>
                  <button onClick={() => toggleDone(w.id)} className={`mt-0.5 w-6 h-6 rounded-full flex items-center justify-center shrink-0 border-2 transition-all ${w.done ? "bg-green-500 border-green-500 text-white" : "border-white/30 hover:border-green-400"}`}>
                    {w.done && <Icon name="check" cls="w-3.5 h-3.5" />}
                  </button>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      <span className={`font-medium text-sm ${w.done ? "line-through text-white/40" : ""}`}>{w.name}</span>
                      {w.done && <span className="text-xs bg-green-500/20 text-green-400 px-1.5 py-0.5 rounded-full">Done</span>}
                    </div>
                    <p className="text-xs text-white/50 mt-0.5">{w.muscles}</p>
                    <div className="flex gap-3 mt-1">
                      <span className="text-xs text-blue-400">{w.duration} phút</span>
                      {w.calories > 0 && <span className="text-xs text-orange-400">{w.calories} kcal</span>}
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button onClick={() => setModal({ item: w })} className="p-1.5 rounded-lg text-white/40 hover:text-blue-400 hover:bg-blue-400/10 transition-colors"><Icon name="edit" cls="w-3.5 h-3.5" /></button>
                    <button onClick={() => deleteW(w.id)} className="p-1.5 rounded-lg text-white/40 hover:text-red-400 hover:bg-red-400/10 transition-colors"><Icon name="trash" cls="w-3.5 h-3.5" /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}

      {/* Empty state if no workouts */}
      {workouts.length === 0 && (
        <div className="text-center py-12 text-white/30">
          <Icon name="dumbbell" cls="w-12 h-12 mx-auto mb-3 opacity-30" />
          <p>Chưa có lịch tập. Thêm buổi tập đầu tiên!</p>
        </div>
      )}

      {modal !== null && <WorkoutModal item={modal.item} onSave={handleSave} onClose={() => setModal(null)} />}
    </div>
  );
}

  const allFoods = Object.values(meals).flat();
  const totalCal = allFoods.reduce((s, f) => s + f.calories, 0);
  const totalProt = allFoods.reduce((s, f) => s + f.protein, 0);
  const doneWorkouts = workouts.filter(w => w.done);
  const caloriesBurned = doneWorkouts.reduce((s, w) => s + (w.calories || 0), 0);
  const netCal = totalCal - caloriesBurned;
  const waterL = (waterMl / 1000).toFixed(2);

  // Smart suggestions
  const suggestions = [];
  if (totalProt < goals.protein * 0.6) suggestions.push({ type: "warn", text: "Bạn nên bổ sung thêm protein như ức gà, trứng, sữa chua Hy Lạp hoặc whey." });
  if (totalCal < goals.calories * 0.5 && totalCal > 0) suggestions.push({ type: "info", text: "Bạn có thể cần ăn thêm để tránh thiếu năng lượng trong ngày." });

                {syncing ? "Đang đồng bộ..." : synced ? "Đồng bộ lại" : "Sync Data"}
              </button>
              <button onClick={() => { setHealthConnected(false); setSynced(false); }} className="py-2.5 px-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm transition-colors">
                Ngắt kết nối
              </button>
            </div>
            {synced && <p className="text-xs text-green-400 text-center mt-2">✓ Đã đồng bộ dữ liệu từ Apple Health</p>}
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState(0);
  const [meals, setMeals] = useLocalStorage("ft_meals", defaultMeals);
  const [workouts, setWorkouts] = useLocalStorage("ft_workouts", defaultWorkouts);
  const [goals, setGoals] = useLocalStorage("ft_goals", defaultGoals);
  const [foodDB, setFoodDB] = useLocalStorage("ft_fooddb", defaultFoodDB);
  const [waterMl] = useLocalStorage("ft_water", 750);

  const tabs = [
    { label: "Dinh dưỡng", icon: "food" },
    { label: "Lịch tập", icon: "dumbbell" },
    { label: "Tiến trình", icon: "chart" },
  ];

  return (
    <div className="min-h-screen flex flex-col" style={{ background: "linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%)" }}>
      {/* Header */}
      <div className="glass sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div>
          <h1 className="text-xl font-extrabold gradient-text">FitTrack</h1>
          <p className="text-xs text-white/40">Your personal fitness companion</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="text-right">
            <p className="text-xs text-white/50">{new Date().toLocaleDateString("vi-VN", { weekday: "long", day: "2-digit", month: "2-digit" })}</p>
          </div>
        </div>
      </div>

      {/* Content */}
      <div className="flex-1 max-w-lg mx-auto w-full px-4 pt-4">
        {tab === 0 && <NutritionTab meals={meals} setMeals={setMeals} goals={goals} foodDB={foodDB} setFoodDB={setFoodDB} />}
        {tab === 1 && <WorkoutTab workouts={workouts} setWorkouts={setWorkouts} />}
        {tab === 2 && <ProgressTab meals={meals} workouts={workouts} goals={goals} setGoals={setGoals} waterMl={waterMl} />}
      </div>

      {/* Bottom Tab Bar */}
      <div className="glass sticky bottom-0 z-40 px-4 py-2 flex">
        {tabs.map((t, i) => (
          <button key={i} onClick={() => setTab(i)} className={`flex-1 flex flex-col items-center gap-1 py-2 rounded-xl transition-all ${tab === i ? "tab-active text-white" : "text-white/40 hover:text-white/70"}`}>
            <Icon name={t.icon} cls="w-5 h-5" />
            <span className="text-xs font-medium">{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
